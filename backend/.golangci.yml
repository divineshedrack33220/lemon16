linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - gofmt

linters-settings:
  errcheck:
    check-blank: true
  gosec:
    excludes:
      - G104  # unhandled errors on deferred close (false positives)
      - G304  # file inclusion via variable (expected in config loading)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
